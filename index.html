<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Marketplace</title>
    <!-- Applies the saved theme (or the OS preference) before React loads, so there is no light/dark flash.
         Keep this script byte-for-byte stable: the production CSP in the README pins its sha256 hash. -->
    <script>(function(){try{var t=localStorage.getItem('mp.theme');var d=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',d);}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
